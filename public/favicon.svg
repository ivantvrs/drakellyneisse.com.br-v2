<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dra. Kelly Neisse — perícia médica judicial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251d12"/>
      <stop offset=".55" stop-color="#15100a"/>
      <stop offset="1" stop-color="#0b0805"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".24" r=".75">
      <stop offset="0" stop-color="#cda766" stop-opacity=".45"/>
      <stop offset=".65" stop-color="#cda766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="4" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0dea6"/>
      <stop offset=".5" stop-color="#cda766"/>
      <stop offset="1" stop-color="#a87c2c"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.2" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7.2" fill="url(#glow)"/>

  <!-- esqueleto: coluna, travessão, correntes e base -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 7 V21.4" stroke-width="2.4"/>
    <path d="M6.6 10.4 H25.4" stroke-width="2.4"/>
    <path d="M6.6 10.4 L4.4 12.8 M6.6 10.4 L8.8 12.8" stroke-width="1.4"/>
    <path d="M25.4 10.4 L23.2 12.8 M25.4 10.4 L27.6 12.8" stroke-width="1.4"/>
    <path d="M11 24 H21" stroke-width="2.4"/>
  </g>

  <!-- pratos sólidos (semicírculo) e pedestal -->
  <path d="M3.6 12.8 A3 3 0 0 0 9.6 12.8 Z" fill="url(#gold)"/>
  <path d="M22.4 12.8 A3 3 0 0 0 28.4 12.8 Z" fill="url(#gold)"/>
  <path d="M16 19.8 L12.4 24 L19.6 24 Z" fill="url(#gold)"/>

  <!-- fiel central dourado -->
  <circle cx="16" cy="6.4" r="1.9" fill="url(#gold)"/>
</svg>
