    (function () {
      try {
        var T = (window.__tvrs = window.__tvrs || {});

        var SESS = '_ga_N6G6FSD34E';

        var NINETY_DAY = '; path=/; max-age=7776000; SameSite=Lax';  // janela de conversao do gclid

        var cidM = ck.match(/_ga=GA1\.\d+\.([0-9.]+)/);

        }

        // session_id + session_count — cookie _ga_N6G6FSD34E com TIMEOUT REAL DE 30 MIN,
        // renovado a cada hit (em T.send) p/ deslizar a janela enquanto a sessao esta ativa.
        function writeSession() {
          try {
            document.cookie = SESS + '=GS1.1.' + T.sid + '.' + T.sct + '.1.' +
              Math.floor(Date.now() / 1000) + '.0.0.0' + THIRTY_MIN;
          } catch (_) {}
        }
        var sM = ck.match(/_ga_N6G6FSD34E=GS1\.1\.(\d+)\.(\d+)/);
        if (sM) {
          // sessao ainda viva (cookie de 30 min nao expirou) -> reaproveita
          T.sid = sM[1];
          T.sct = sM[2];
          T.newSession = false;
        } else {
          // sem cookie = sessao expirou (>30 min) ou 1a visita -> NOVA sessao
          T.sid = String(Math.floor(Date.now() / 1000));
          var prev = (ck.match(/_tvrs_sct=(\d+)/) || [])[1];
          T.sct = String((parseInt(prev, 10) || 0) + 1); // numero da sessao do usuario
          T.newSession = true;
          try { document.cookie = '_tvrs_sct=' + T.sct + TWO_YEARS; } catch (_) {}
        }
        writeSession();

        // gclid + utm — em COOKIE FIRST-PARTY de 90 dias (antes era sessionStorage,
        // que morria ao fechar a aba e fazia quem voltava perder a atribuicao do Ads)
        function persist(name, val) {
          try {
            if (val) { document.cookie = name + '=' + encodeURIComponent(val) + NINETY_DAY; return val; }
            var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : '';
          } catch (_) { return val || ''; }
        }

          try {
            var saved = sessionStorage.getItem('_tvrs_qs');
            if (saved) return saved;
            var s = (location.search || '').replace(/^\?/, '');
            if (s) { sessionStorage.setItem('_tvrs_qs', s); }
            return s;
          } catch (_) { return (location.search || '').replace(/^\?/, ''); }

          var p = { v: '2', tid: MID, cid: T.cid, sid: T.sid, sct: T.sct, seg: '1' };

    <script>

            document.documentElement.scrollHeight

          if (denom <= 0) { ticking = false; return; }
          var percent = Math.round((window.scrollY / denom) * 100);
          for (var i = 0; i < thresholds.length; i++) {
            var t = thresholds[i];
            if (percent >= t && !fired[t]) {
              fired[t] = true;
              // beacon direto ao GA4 — sobrevive mesmo quando o GTM não carrega
              try {
                var T = window.__tvrs;
                if (T && T.base) {
                  var p = T.base();
                  p.en = 'scroll_depth';
                  p._et = String(Math.max(1, Math.round(performance.now())));
                  p['epn.percent_scrolled'] = t;
                  p.dl = location.href;
                  p.dt = document.title;
                  T.send(p);
                }
              } catch (_) {}
              // dataLayer.push original (mantido como fallback p/ outras tags do GTM)
              window.dataLayer.push({
                event: 'scroll_depth',
                percent_scrolled: t
              });
            }
          }
          ticking = false;
        }
        window.addEventListener('scroll', function () {
          if (!ticking) {
            window.requestAnimationFrame(checkScroll);
            ticking = true;

            if (fired) return;
            fired = true;
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("pointerdown", go);
            window.removeEventListener("touchstart", go);
            loadFab();
          }
          function onScroll() {
            // só dispara quando o lead DESCE ~meia dobra (rumo à 2ª seção). Antes disso o FAB
            // (1,35 MB) nem começa a baixar — 1ª pintura do mobile fica o mais leve possível.
            if ((window.scrollY || window.pageYOffset || 0) > window.innerHeight * 0.5) go();
          }
          window.addEventListener("scroll", onScroll, { passive: true });
          // toque/click também dispara (lead que interage sem rolar). Sem timeout: máxima leveza —
          // quem não rola nem toca usa a barra fixa de contato; o FAB simplesmente não carrega.
          window.addEventListener("pointerdown", go, { passive: true });
          window.addEventListener("touchstart", go, { passive: true });
        }
        schedule();
      })();
    </script>
  </body>
</html>
