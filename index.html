    <!-- Tracking helper — resolve/memoiza cid, session_id e gclid p/ todos os beacons GA4 (sem libs de terceiros) -->
    <script>
    (function () {
      try {
        var T = (window.__tvrs = window.__tvrs || {});
        var MID = 'G-N6G6FSD34E';
        var SESS = '_ga_N6G6FSD34E';
        var ck = document.cookie;
        var TWO_YEARS  = '; path=/; max-age=63072000; SameSite=Lax';
        var NINETY_DAY = '; path=/; max-age=7776000; SameSite=Lax';  // janela de conversao do gclid
        var THIRTY_MIN = '; path=/; max-age=1800; SameSite=Lax';     // timeout real de sessao do GA4

        // client_id — cookie _ga (GA1.<x>.<cid>); 2 anos (correto, NAO mexer)
        var cidM = ck.match(/_ga=GA1\.\d+\.([0-9.]+)/);
        if (cidM) {
          T.cid = cidM[1];
          T.newUser = false;
        } else {
          T.cid = Math.floor(Math.random() * 2147483647) + '.' + Math.floor(Date.now() / 1000);
          T.newUser = true;
          try { document.cookie = '_ga=GA1.1.' + T.cid + TWO_YEARS; } catch (_) {}
        }

        // session_id + session_count — cookie _ga_N6G6FSD34E com TIMEOUT REAL DE 30 MIN,
        // renovado a cada hit (em T.send) p/ deslizar a janela enquanto a sessao esta ativa.
        function writeSession() {
          try {
            document.cookie = SESS + '=GS1.1.' + T.sid + '.' + T.sct + '.1.' +
              Math.floor(Date.now() / 1000) + '.0.0.0' + THIRTY_MIN;
          } catch (_) {}
        }
        var sM = ck.match(/_ga_N6G6FSD34E=GS1\.1\.(\d+)\.(\d+)/);
        if (sM) {
          // sessao ainda viva (cookie de 30 min nao expirou) -> reaproveita
          T.sid = sM[1];
          T.sct = sM[2];
          T.newSession = false;
        } else {
          // sem cookie = sessao expirou (>30 min) ou 1a visita -> NOVA sessao
          T.sid = String(Math.floor(Date.now() / 1000));
          var prev = (ck.match(/_tvrs_sct=(\d+)/) || [])[1];
          T.sct = String((parseInt(prev, 10) || 0) + 1); // numero da sessao do usuario
          T.newSession = true;
          try { document.cookie = '_tvrs_sct=' + T.sct + TWO_YEARS; } catch (_) {}
        }
        writeSession();

        // gclid + utm — em COOKIE FIRST-PARTY de 90 dias (antes era sessionStorage,
        // que morria ao fechar a aba e fazia quem voltava perder a atribuicao do Ads)
        function persist(name, val) {
          try {
            if (val) { document.cookie = name + '=' + encodeURIComponent(val) + NINETY_DAY; return val; }
            var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : '';
          } catch (_) { return val || ''; }
        }
        var q;
        try { q = new URLSearchParams(location.search); } catch (_) { q = null; }
        function fromUrl(k) { return q ? (q.get(k) || '') : ''; }
        T.gclid        = persist('_tvrs_gclid', fromUrl('gclid'));
        T.utm_source   = persist('_tvrs_utm_source', fromUrl('utm_source'));
        T.utm_medium   = persist('_tvrs_utm_medium', fromUrl('utm_medium'));
        T.utm_campaign = persist('_tvrs_utm_campaign', fromUrl('utm_campaign'));

        // first-touch: query string inteira da 1a pagina (UTM+gclid p/ links do TinTim) — INALTERADO
        T.qs = (function () {
          try {
            var saved = sessionStorage.getItem('_tvrs_qs');
            if (saved) return saved;
            var s = (location.search || '').replace(/^\?/, '');
            if (s) { sessionStorage.setItem('_tvrs_qs', s); }
            return s;
          } catch (_) { return (location.search || '').replace(/^\?/, ''); }
        })();

        // params base de sessao reutilizados por todos os beacons
        T.base = function () {
          var p = { v: '2', tid: MID, cid: T.cid, sid: T.sid, sct: T.sct, seg: '1' };
          if (T.gclid) p.gclid = T.gclid; // chave da atribuicao google/cpc
          return p;
        };

        // envia hit ao Measurement Protocol (/g/collect) + RENOVA o cookie de sessao (mais 30 min)
        T.send = function (params) {
          try {
            writeSession();
            var u = 'https://www.google-analytics.com/g/collect?' + new URLSearchParams(params).toString();
            if (navigator.sendBeacon) { navigator.sendBeacon(u); } else { new Image().src = u; }
          } catch (_) {}
        };
      } catch (e) { /* nunca quebrar UX */ }
    })();

        if (T.newSession) p._ss = '1'; // session start só quando a sessão é nova (evita inflar em reload)
        if (T.newUser) p._fv = '1';    // first visit só p/ usuário novo
        p['ep.transport'] = 'beacon_direct';
        p.dl = location.href;          // carrega utm/gclid da URL p/ o GA4 derivar a fonte
        p.dr = document.referrer || '';
        p.dt = document.title;
        p.sr = screen.width + 'x' + screen.height;
        p.ul = (navigator.language || 'pt-BR').toLowerCase();
        T.send(p);
        // Sentinel para GTM identificar e poder dedupar a tag GA4 page_view depois
        window.__pv_sent_via_beacon = true;
      } catch (e) {
        // nunca quebrar UX
      }
    })();

    <!-- Engagement tracking: scroll depth + WhatsApp clicks (dataLayer → GA4 via GTM) -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];

        // 1) Scroll depth: 25 / 50 / 75 / 90
        var thresholds = [25, 50, 75, 90];
        var fired = {};
        var ticking = false;
        function checkScroll() {
          var docH = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );
          var denom = docH - window.innerHeight;
          if (denom <= 0) { ticking = false; return; }
          var percent = Math.round((window.scrollY / denom) * 100);
          for (var i = 0; i < thresholds.length; i++) {
            var t = thresholds[i];
            if (percent >= t && !fired[t]) {
              fired[t] = true;
              // beacon direto ao GA4 — sobrevive mesmo quando o GTM não carrega
              try {
                var T = window.__tvrs;
                if (T && T.base) {
                  var p = T.base();
                  p.en = 'scroll_depth';
                  p._et = String(Math.max(1, Math.round(performance.now())));
                  p['epn.percent_scrolled'] = t;
                  p.dl = location.href;
                  p.dt = document.title;
                  T.send(p);
                }
              } catch (_) {}
              // dataLayer.push original (mantido como fallback p/ outras tags do GTM)
              window.dataLayer.push({
                event: 'scroll_depth',
                percent_scrolled: t
              });
            }
          }
          ticking = false;
        }
        window.addEventListener('scroll', function () {
          if (!ticking) {
            window.requestAnimationFrame(checkScroll);
            ticking = true;
          }
        }, { passive: true });

        // 2) WhatsApp click (delegated — funciona para elementos renderizados pelo React depois do load)
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
          if (!a) return;
          var href = (a.getAttribute('href') || '').toLowerCase();
          if (href.indexOf('wa.me') === -1 && href.indexOf('whatsapp') === -1) return;

          // repassa os parâmetros de origem (utm, gclid, etc.) para o link do TinTim, antes da navegação
          try {
            if (a.href.indexOf('tintim') !== -1 && !a.dataset.tvrsTagged) {
              var _url = new URL(a.href);
              var _src = new URLSearchParams((window.__tvrs && window.__tvrs.qs) || '');
              _src.forEach(function (val, key) {
                if (val && !_url.searchParams.has(key)) _url.searchParams.set(key, val);
              });
              var _g = window.__tvrs && window.__tvrs.gclid;
              if (_g && !_url.searchParams.has('gclid')) _url.searchParams.set('gclid', _g);
              a.href = _url.toString();
              a.dataset.tvrsTagged = '1';
            }
          } catch (_) {}

          // ★ envia beacon DIRETO ao GA4 — funciona sem GTM e sobrevive ao unload
          try {
            var T = window.__tvrs;
            if (T && T.base) {
              var p = T.base();
              p.en = 'whatsapp_click';
              p._et = String(Math.max(1, Math.round(performance.now()))); // tempo real desde o load (ms)
              p['ep.event_category'] = 'conversao';
              p['ep.link_url'] = a.href;
              p['ep.transport'] = 'beacon_direct';
              p.dl = location.href;
              p.dr = document.referrer || '';
              p.dt = document.title;
              T.send(p);
            }
          } catch (err) {
            // não quebrar UX se algo der errado no beacon
          }

          // dataLayer.push original (mantido para outros tags do GTM)
          window.dataLayer.push({
            event: 'whatsapp_click',
            event_category: 'conversao',
            link_url: a.href
          });
        }, true);
      })();
    </script>
